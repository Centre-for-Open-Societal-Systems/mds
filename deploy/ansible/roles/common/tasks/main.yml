---
- name: Assert supported OS
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_major_version is version('22', '>=')
    fail_msg: "Only Ubuntu 22.04+ is supported (found {{ ansible_distribution }} {{ ansible_distribution_version }})"

- name: Install base packages
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - jq
      - tar
      - gnupg
      - python3-pip
      - python3-venv
      - open-iscsi
      - nfs-common
      - chrony
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure chrony is running (TLS + JWT need accurate clocks)
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true

- name: Disable swap now
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb | int > 0
  changed_when: true

- name: Disable swap permanently
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\s+swap\s+.*)$'
    replace: '# \1'

- name: Load kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
    persistent: present
  loop:
    - overlay
    - br_netfilter

- name: Kernel parameters for Kubernetes
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-kubernetes.conf
    reload: true
  loop: "{{ sysctl_settings | dict2items }}"
  vars:
    sysctl_settings:
      net.ipv4.ip_forward: 1
      net.bridge.bridge-nf-call-iptables: 1
      net.bridge.bridge-nf-call-ip6tables: 1
      fs.inotify.max_user_watches: 524288
      fs.inotify.max_user_instances: 512

- name: Disable ufw (cloud security groups are the perimeter; ufw breaks flannel)
  community.general.ufw:
    state: disabled
  failed_when: false
