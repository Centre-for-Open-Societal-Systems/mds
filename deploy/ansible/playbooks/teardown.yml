---
# DESTRUCTIVE. Deletes ONE environment namespace (develop or staging) including its PostgreSQL/MinIO volumes.
#   ansible-playbook playbooks/teardown.yml -e mds_env=develop -e confirm=DELETE-MDS
#   ansible-playbook playbooks/teardown.yml -e mds_env=develop -e confirm=DELETE-MDS -e uninstall_k3s=true   # also remove the cluster
- name: Remove MDS from the cluster
  hosts: kube_control[0]
  become: true
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ k8s_venv }}/bin/python"
  environment:
    K8S_AUTH_KUBECONFIG: "{{ kubeconfig_path }}"
    KUBECONFIG: "{{ kubeconfig_path }}"
  pre_tasks:
    - name: Load target environment
      ansible.builtin.import_tasks: tasks/load-env.yml
  tasks:
    - name: Require confirmation
      ansible.builtin.assert:
        that: confirm | default('') == 'DELETE-MDS'
        fail_msg: "Refusing to delete. Take a backup first (playbooks/backup.yml), then pass -e confirm=DELETE-MDS"

    - name: Delete namespace {{ mds_namespace }}
      kubernetes.core.k8s:
        state: absent
        kind: Namespace
        name: "{{ mds_namespace }}"
        wait: true
        wait_timeout: 600

- name: Uninstall k3s agents
  hosts: k3s_agents
  become: true
  gather_facts: false
  tasks:
    - name: Run k3s-agent-uninstall.sh
      ansible.builtin.command: /usr/local/bin/k3s-agent-uninstall.sh
      args:
        removes: /usr/local/bin/k3s-agent-uninstall.sh
      when: uninstall_k3s | default(false) | bool

- name: Uninstall k3s server
  hosts: k3s_server
  become: true
  gather_facts: false
  tasks:
    - name: Run k3s-uninstall.sh
      ansible.builtin.command: /usr/local/bin/k3s-uninstall.sh
      args:
        removes: /usr/local/bin/k3s-uninstall.sh
      when: uninstall_k3s | default(false) | bool
