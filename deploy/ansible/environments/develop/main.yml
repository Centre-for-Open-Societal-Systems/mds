---
# =============================================================================
# DEVELOP environment -> Kubernetes namespace "develop"
# Overrides inventory/group_vars/all/main.yml. Loaded with: -e mds_env=develop
# =============================================================================
mds_environment: develop
mds_namespace: develop

# Hostnames: Route 53 A records (zone oanstaging.com) -> 13.126.71.6, the MDS-dev-staging server
# (no Elastic IP: the public IP changes on every stop/start; update the records then).
# (Was mds.mda.test / mds-api.mda.test via hosts files until 2026-10-14.)
mds_ui_host: mds-dev.oanstaging.com
mds_api_host: mds-api-dev.oanstaging.com
mds_minio_console_host: mds-minio-dev.oanstaging.com

# Public DNS (Route 53) -> trusted Let's Encrypt certificates (HTTP-01 via ingress-nginx, port 80).
tls_cluster_issuer: letsencrypt-prod

# Single-node RKE2: bundled ingress-nginx runs in kube-system with hostNetwork,
# so its traffic reaches pods from the node subnet.
mds_ingress_controller_namespace: kube-system
mds_ingress_source_cidrs: ["10.0.1.0/24"]

# Develop may track newer image tags than staging. Uncomment to override the shared values.
# mds_api_image: <registry>/openg2p-master-data-api:<dev-tag>
# mds_ui_image: <registry>/openg2p-master-data-ui:<dev-tag>

# Small footprint: single replica, no autoscaling
mds_api_replicas: 1
mds_ui_replicas: 1
mds_hpa_enabled: false
# No CPU headroom on the single node for a surge pod: replace in place (brief downtime on deploy).
mds_rollout_max_unavailable: 1
mds_rollout_max_surge: 0

# Minimal CPU requests: develop and staging share the 2-vCPU node with RKE2 + Rancher
# (~1.7 CPU requested). Limits still let pods burst when the CPU is idle.
mds_api_resources:
  requests: { cpu: 50m, memory: 256Mi }
  limits: { cpu: 500m, memory: 768Mi }
mds_ui_resources:
  requests: { cpu: 30m, memory: 192Mi }
  limits: { cpu: 500m, memory: 512Mi }
mds_postgres_resources:
  requests: { cpu: 40m, memory: 256Mi }
  limits: { cpu: 500m, memory: 1Gi }
mds_minio_resources:
  requests: { cpu: 20m, memory: 128Mi }
  limits: { cpu: 250m, memory: 512Mi }
# One-off job: near-zero CPU request because the 2-vCPU node is ~99% CPU-requested
# by RKE2 + Rancher + MDS. It still bursts up to its limit when CPU is idle.
mds_seed_resources:
  requests: { cpu: 1m, memory: 256Mi }
  limits: { cpu: "1", memory: 1Gi }

mds_postgres_storage: 10Gi
mds_minio_storage: 10Gi

# Backups
mds_backup_enabled: true
mds_backup_schedule: "30 0 * * *"   # 00:30 UTC, offset from staging
mds_backup_retention_days: 3
mds_backup_storage: 20Gi

# Access restriction
mds_ingress_allowlist_cidrs: []
mds_ingress_basic_auth_enabled: false

# Login through the shared Keycloak (playbook 05-keycloak.yml, realm mds-develop).
# Users: mds-admin / mds-maker / mds-checker (initial passwords: Secret mds-keycloak-users).
mds_keycloak_enabled: true
mds_keycloak_public_url: https://keycloak-dev.oanstaging.com

# Cluster: single-node RKE2 on the MDS-dev-staging server (Ansible runs on that server).
kubeconfig_path: /etc/rancher/rke2/rke2.yaml
